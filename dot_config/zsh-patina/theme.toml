# overrides on top of the built-in "patina" theme — colors are ANSI names,
# not hex, so they follow whatever palette tinty currently has applied
"dynamic.callable" = "green"
"dynamic.callable.alias" = "green"
"dynamic.callable.builtin" = "green"
"dynamic.callable.command" = "green"
"dynamic.callable.function" = "green"

[metadata]
extends = "patina"
