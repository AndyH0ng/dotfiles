# python is pinned exactly: venvs and uv lockfiles break across minor versions.
# "latest"/"lts" are frozen in mise.lock; bump with `mise lock -g --bump`.
[tools]
bun = "latest"
java = "temurin-21"
node = "lts"
pnpm = "latest"
python = "3.14.7"

[settings]
lockfile_platforms = ["macos-arm64"]
minimum_release_age = "7d"
