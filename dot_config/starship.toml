add_newline = true

format = """
$directory$git_branch$git_status$bun$python$java$cmd_duration$line_break$character"""

[directory]
truncation_length = 1
truncate_to_repo = false
style = "bold #57c7ff"

[git_branch]
style = "bold #ff6ac1"
symbol = ""
format = "on [$branch]($style) "

[git_status]
style = "bold #ff5c57"
format = "[*]($style) "

[bun]
style = "bold #5af78e"

[python]
style = "bold #57c7ff"

[java]
style = "bold #ff9f43"

[cmd_duration]
min_time = 2000
style = "bold #78787e"

[character]
success_symbol = "[>](#5af78e)"
error_symbol = "[>](#ff5c57)"
