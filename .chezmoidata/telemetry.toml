#   env         every shell + the install script (HOMEBREW_* also go to brew.env)
#   claude_env  ~/.claude/settings.json "env" (the desktop app doesn't inherit the shell env)
#   codex       managed TOML keys in ~/.codex/config.toml
#   commands    install runs `run`, doctor runs `check` (exit 0 = off)
# chrome-devtools-mcp's flag lives in its MCP registration in the install script.

[telemetry.env]
DO_NOT_TRACK = "1"
HOMEBREW_NO_ANALYTICS = "1"
CR_CLI_TELEMETRY_DISABLED = "1"     # coderabbit
NEXT_TELEMETRY_DISABLED = "1"
TURBO_TELEMETRY_DISABLED = "1"
ASTRO_TELEMETRY_DISABLED = "1"
STORYBOOK_DISABLE_TELEMETRY = "1"
WRANGLER_SEND_METRICS = "false"

[telemetry.claude_env]
DISABLE_TELEMETRY = "1"
DISABLE_ERROR_REPORTING = "1"

[telemetry.codex.analytics]
enabled = false

[[telemetry.commands]]
tool = "brew"
run = "brew analytics off"
check = "brew analytics state | grep -q 'analytics are disabled'"

[[telemetry.commands]]
tool = "gh"
run = "gh config set telemetry disabled"
check = '[ "$(gh config get telemetry)" = disabled ]'

[[telemetry.commands]]
tool = "codex"
run = '''uv run --script "${DOTFILES_SOURCE_DIR:-$(chezmoi source-path)}/scripts/codex_config.py" --telemetry-only --file "${CODEX_HOME:-$HOME/.codex}/config.toml"'''
check = '''uv run --script "${DOTFILES_SOURCE_DIR:-$(chezmoi source-path)}/scripts/codex_config.py" --telemetry-only --check --file "${CODEX_HOME:-$HOME/.codex}/config.toml"'''
