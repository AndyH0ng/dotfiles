# Telemetry opt-outs — the single place they're defined.
#   env         exported in every shell (~/.config/zsh/telemetry.zsh, sourced by
#               .zshenv) and in the install script itself
#   claude_env  injected into ~/.claude/settings.json "env" (Claude Code launched
#               from the desktop app doesn't inherit the shell environment)
#   commands    opt-outs stored in a tool's own config; the install script runs
#               `run` when `tool` is installed, dotfiles-doctor runs `check`
#               (exit 0 = off)
# Not here: chrome-devtools-mcp's --no-usage-statistics lives in its MCP
# registration in the install script, next to its other flags.

[telemetry.env]
DO_NOT_TRACK = "1"                  # generic (bun, astro, turbo, …)
HOMEBREW_NO_ANALYTICS = "1"
CR_CLI_TELEMETRY_DISABLED = "1"     # coderabbit
NEXT_TELEMETRY_DISABLED = "1"
TURBO_TELEMETRY_DISABLED = "1"
ASTRO_TELEMETRY_DISABLED = "1"
STORYBOOK_DISABLE_TELEMETRY = "1"
WRANGLER_SEND_METRICS = "false"

[telemetry.claude_env]
DISABLE_TELEMETRY = "1"
DISABLE_ERROR_REPORTING = "1"

[[telemetry.commands]]
tool = "brew"
run = "brew analytics off"
check = "brew analytics state | grep -q 'analytics are disabled'"

[[telemetry.commands]]
tool = "gh"
run = "gh config set telemetry disabled"
check = '[ "$(gh config get telemetry)" = disabled ]'

[[telemetry.commands]]
tool = "codex"
run = '''mkdir -p ~/.codex && touch ~/.codex/config.toml && { grep -q '^\[analytics\]' ~/.codex/config.toml || printf '\n[analytics]\nenabled = false\n' >> ~/.codex/config.toml; }'''
check = '''sed -n '/^\[analytics\]/,/^\[/p' ~/.codex/config.toml | grep -q '^enabled = false' '''
