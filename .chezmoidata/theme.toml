# Single source of truth for the terminal look: colors and fonts. Ghostty, starship, tinty,
# vivid and the Claude Code statusline are all rendered from this file.
# To switch themes: change the names below, copy the palette from
# ~/.local/share/tinted-theming/tinty/repos/schemes/base16/<scheme>.yaml,
# then run `chezmoi apply`.
[theme]
scheme = "base16-snazzy" # tinty scheme
vivid = "snazzy"         # `vivid themes` for LS_COLORS
background = "0a0e14"    # terminal background (darker than base00)

[theme.palette]
base00 = "282a36"
base01 = "34353e"
base02 = "43454f"
base03 = "78787e"
base04 = "a5a5a9"
base05 = "e2e4e5"
base06 = "eff0eb"
base07 = "f1f1f0"
base08 = "ff5c57"
base09 = "ff9f43"
base0A = "f3f99d"
base0B = "5af78e"
base0C = "9aedfe"
base0D = "57c7ff"
base0E = "ff6ac1"
base0F = "b2643c"

# Terminal fonts, in fallback order. Ghostty is rendered from this list.
# Brewfile can't be templated, so each cask is also listed there;
# dotfiles-doctor fails if a cask is missing from Brewfile or Ghostty
# can't find a family by this exact name (`ghostty +list-fonts`).
[theme.font]
size = 14

[[theme.font.families]]
name = "IBM Plex Mono"            # Latin
cask = "font-ibm-plex-mono"

[[theme.font.families]]
name = "D2Coding"                 # Hangul
cask = "font-d2coding"

[[theme.font.families]]
name = "Symbols Nerd Font Mono"   # icons
cask = "font-symbols-only-nerd-font"
