# `defaults write` type comes from the TOML value (bool/int/string).
# restart: app to relaunch so the change applies

# keyboard (takes effect after logout)
[[macos.defaults]]
domain = "NSGlobalDomain"
key = "KeyRepeat"
value = 2

[[macos.defaults]]
domain = "NSGlobalDomain"
key = "InitialKeyRepeat"
value = 15

[[macos.defaults]]
domain = "NSGlobalDomain"
key = "ApplePressAndHoldEnabled"
value = false

[[macos.defaults]]
domain = "NSGlobalDomain"
key = "NSAutomaticCapitalizationEnabled"
value = false

[[macos.defaults]]
domain = "NSGlobalDomain"
key = "NSAutomaticPeriodSubstitutionEnabled"
value = false

[[macos.defaults]]
domain = "NSGlobalDomain"
key = "NSAutomaticQuoteSubstitutionEnabled"
value = false

[[macos.defaults]]
domain = "com.apple.finder"
key = "ShowPathbar"
value = true
restart = "Finder"

[[macos.defaults]]
domain = "com.apple.finder"
key = "FXEnableExtensionChangeWarning"
value = false
restart = "Finder"

# empty the Trash after 30 days (agents' rm goes there)
[[macos.defaults]]
domain = "com.apple.finder"
key = "FXRemoveOldTrashItems"
value = true
restart = "Finder"

[[macos.defaults]]
domain = "com.apple.desktopservices"
key = "DSDontWriteNetworkStores"
value = true

[[macos.defaults]]
domain = "com.apple.desktopservices"
key = "DSDontWriteUSBStores"
value = true

# default apps (duti), only where the app's optional group is installed.
# An extension without a registered UTI (dyn.*: cts, jsx, cjs, jsonc, scss) can't be set.
[[macos.default_apps]]
app = "com.jetbrains.WebStorm"
group = "ide"
extensions = ["ts", "tsx", "mts", "js", "mjs", "json", "md", "mdx", "yaml", "yml", "toml", "css", "sh", "zsh"]
