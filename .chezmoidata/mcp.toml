# Shared transport definition; clients keep their own authentication and state.
[mcp.chrome_devtools]
command = "bunx"
args = ["chrome-devtools-mcp@latest", "--autoConnect", "--channel", "canary", "--no-usage-statistics"]

# Built into Safari 27 or later. No third-party server or runtime required.
[mcp.safari]
command = "/usr/bin/safaridriver"
args = ["--mcp"]
