name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly: upstream breakage (renamed formulae, tap trust, …)
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # full history for the secret scan
          persist-credentials: false

      - name: Install chezmoi
        run: brew install chezmoi

      - name: Turn on the claude group
        # promptBoolOnce keeps an existing answer; --promptDefaults turns the rest off
        run: |
          mkdir -p ~/.config/chezmoi
          printf '[data.install]\nclaude = true\n' > ~/.config/chezmoi/chezmoi.toml

      - name: chezmoi init --apply
        run: chezmoi init --apply --no-tty --promptDefaults --source "$GITHUB_WORKSPACE"

      - name: Interactive zsh starts cleanly
        run: |
          out=$(zsh -i -c 'echo VIVID=$VIVID_THEME; echo LS_COLORS=${#LS_COLORS}; abbr list | grep -q "^.ls.=" && echo abbr-ok' 2>&1)
          echo "$out"
          if echo "$out" | grep -qiE 'command not found|no such file|parse error'; then exit 1; fi
          echo "$out" | grep -q '^VIVID=.\+' || exit 1
          echo "$out" | grep -q '^abbr-ok' || exit 1

      - name: dotfiles-doctor reports no drift
        run: |
          eval "$(brew shellenv 2>/dev/null || /opt/homebrew/bin/brew shellenv)"
          export PATH="$HOME/.local/bin:$PATH"
          dotfiles-doctor --json | tee "$RUNNER_TEMP/doctor.json" || true
          jq -e '.chezmoi_drift == [] and .dangling_symlinks == [] and .brew.missing == [] and .uv_tools_missing == []
                 and .theme_mismatch == [] and .font_mismatch == []
                 and .telemetry_on == [] and .macos_defaults_mismatch == []
                 and .claude_settings_in_sync and .claude_mcp_missing == []' "$RUNNER_TEMP/doctor.json"

      - name: Optional Brewfiles reference real packages
        # groups are off above, so at least check every name resolves
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          for f in Brewfile.*; do
            echo "== $f"
            formulae=$(brew bundle list --file "$f" --formula | xargs)
            casks=$(brew bundle list --file "$f" --cask | xargs)
            # shellcheck disable=SC2086 # split into one arg per package on purpose
            [ -z "$formulae" ] || brew info --json=v2 --formula $formulae >/dev/null
            # shellcheck disable=SC2086
            [ -z "$casks" ] || brew info --json=v2 --cask $casks >/dev/null
          done

      - name: Lint (same script as the pre-commit hook)
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          .githooks/lint

      - name: Secret scan (gitleaks from the Brewfile)
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          gitleaks git "$GITHUB_WORKSPACE" --no-banner --redact

      - name: Symlinks and rendered files
        run: |
          test -L ~/.zshrc
          test -f ~/.config/ghostty/config && ! grep -q '{{' ~/.config/ghostty/config
          test -x ~/.claude/statusline.sh
          echo '{"model":{"display_name":"x"},"workspace":{"current_dir":"/tmp"}}' | ~/.claude/statusline.sh
          jq -e '.statusLine' ~/.claude/settings.json >/dev/null
          test -L ~/.gitconfig
          test "$(git config --global --get merge.conflictStyle)" = zdiff3
          # no signing key on the runner
          test -z "$(git config --global --includes --get commit.gpgSign)"
