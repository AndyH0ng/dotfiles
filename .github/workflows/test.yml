name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly, to catch upstream breakage (renamed formulae, tap trust, …)
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  install:
    # fresh macOS runner: the same path a new Mac takes
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the secret scan

      - name: Install chezmoi
        run: brew install chezmoi

      - name: chezmoi init --apply
        run: chezmoi init --apply --no-tty --promptBool "Install Brewfile.dev (IDEs/OrbStack/Chrome Canary/Figma)=false,Install Brewfile.apps (AdGuard/Notion/LaunchOS)=false,Install Brewfile.fonts (Pretendard/SF)=false" --source "$GITHUB_WORKSPACE"

      - name: Tools on PATH
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          export PATH="$HOME/.local/bin:$PATH"   # uv tools
          test -f "$(brew --prefix)/opt/antidote/share/antidote/antidote.zsh"  # antidote is a sourced zsh function, not a binary
          for t in starship vivid tinty mise zoxide fzf atuin eza bat rg fd uv ruff pyrefly jq xh gitleaks delta; do
            command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }
          done

      - name: Interactive zsh starts cleanly
        run: |
          out=$(zsh -i -c 'echo VIVID=$VIVID_THEME; echo LS_COLORS=${#LS_COLORS}; abbr list | grep -q "^.cat.=" && echo abbr-ok' 2>&1)
          echo "$out"
          if echo "$out" | grep -qiE 'command not found|no such file|parse error'; then exit 1; fi
          echo "$out" | grep -q '^VIVID=.\+' || exit 1
          echo "$out" | grep -q '^abbr-ok' || exit 1

      - name: dotfiles-doctor --json is valid
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          ~/.local/bin/dotfiles-doctor --json | tee doctor.json || true
          jq -e '.chezmoi_drift == [] and .brew.missing == [] and .claude_settings_in_sync' doctor.json

      - name: Secret scan (gitleaks from the Brewfile)
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          gitleaks git "$GITHUB_WORKSPACE" --no-banner --redact

      - name: Symlinks and rendered files
        run: |
          test -L ~/.zshrc
          test -f ~/.config/ghostty/config && ! grep -q '{{' ~/.config/ghostty/config
          test -x ~/.claude/statusline.sh
          echo '{"model":{"display_name":"x"},"workspace":{"current_dir":"/tmp"}}' | ~/.claude/statusline.sh
          jq -e '.statusLine' ~/.claude/settings.json >/dev/null
          test -L ~/.gitconfig
          test "$(git config --global --get merge.conflictStyle)" = zdiff3
          # no signing key on the runner, so signing must stay off
          test -z "$(git config --global --includes --get commit.gpgSign)"
